name: Run Telegram demo bot

on:
  workflow_dispatch:

concurrency:
  group: telegram-demo-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs have a six-hour maximum. Stop the run after a demo.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STAFF_IDS: ${{ secrets.STAFF_IDS }}
        run: python bot.py
